# Plugin: kanban — Compose fragment
# Tags the opencode image so the poller service can reuse it, and defines the
# optional kanban-poller service (profile "kanban-poller"; start it with
# `make kanban-poller-run`). The poller talks to the opencode container and to
# Linear, and uses its own GitHub App credentials (KANBAN_GH_APP_*, mapped to
# the GH_APP_* names gh-app-token reads) for read-only PR and CI checks and for
# git fetch (contents:read). It needs the project checkouts mounted
# (compose.override.yml, same path as opencode) for pre-flight checks,
# worktree creation, and worktree cleanup. No Docker socket, no
# ports. Its entrypoint bypasses the image entrypoint and plugin hooks.
services:
  opencode:
    image: opencode-dockerized-opencode:local

  kanban-poller:
    image: opencode-dockerized-opencode:local
    pull_policy: never
    profiles: ["kanban-poller"]
    user: opencode
    entrypoint: ["/home/opencode/.bun/bin/bun", "/usr/local/lib/opencode/kanban-poller/poller.ts"]
    command: []
    restart: unless-stopped
    depends_on:
      - opencode
    volumes:
      - ${KANBAN_GH_APP_PRIVATE_KEY_PATH:?KANBAN_GH_APP_PRIVATE_KEY_PATH is not set. Set it in .env (see README "Kanban plugin")}:/run/secrets/github-app.pem:ro
    environment:
      GH_APP_ID: ${KANBAN_GH_APP_ID:?KANBAN_GH_APP_ID is not set. Set it in .env (see README "Kanban plugin")}
      GH_APP_INSTALLATION_ID: ${KANBAN_GH_APP_INSTALLATION_ID:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:?LINEAR_API_KEY is not set. Set it in .env (see README "Linear plugin")}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is not set. Set it in .env}
      KANBAN_TEAM: ${KANBAN_TEAM:-DEY}
      KANBAN_POLL_INTERVAL: ${KANBAN_POLL_INTERVAL:-60}
      KANBAN_OPENCODE_URL: ${KANBAN_OPENCODE_URL:-http://opencode:4096}
      KANBAN_TIMEOUT_WORK: ${KANBAN_TIMEOUT_WORK:-60}
      KANBAN_TIMEOUT_REVIEW: ${KANBAN_TIMEOUT_REVIEW:-20}
      KANBAN_TIMEOUT_INVESTIGATE: ${KANBAN_TIMEOUT_INVESTIGATE:-20}
