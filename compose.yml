services:
  opencode:
    container_name: opencode
    build:
      context: ./docker
      dockerfile: ${OPENCODE_DOCKERFILE:-Dockerfile}
      args:
        USER_UID: ${USER_UID:?USER_UID is not set. Run via make commands}
        USER_GID: ${USER_GID:?USER_GID is not set. Run via make commands}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-}
        OH_MY_OPENCODE_SLIM_VERSION: ${OH_MY_OPENCODE_SLIM_VERSION:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.opencode/config:/home/opencode/.config/opencode
      - opencode_share:/home/opencode/.local/share/opencode
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: true
      OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS: "true"
      OPENCODE_ENABLE_EXA: "1"
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is not set. Set it in .env}
      # Optional private registry login, see README "Corporate CA and private registry".
      DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
      DOCKER_REGISTRY_USER: ${DOCKER_REGISTRY_USER:-}
      DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD:-}
    ports:
      - "127.0.0.1:4096:4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  opencode_share:
